[package]
name = "uniffi-bindgen"
description = "UniFFI bindgen binary for redbx-mobile — generates Kotlin/Swift bindings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
