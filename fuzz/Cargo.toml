[package]
name = "redbx-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.1.0", features = ["derive"] }
libfuzzer-sys = { version = "0.4.0", features = ["arbitrary-derive"] }
tempfile = "3.2.0"
rand = "0.8.5"
rand_distr = "0.4.3"

[dependencies.redbx]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_redbx"
path = "fuzz_targets/fuzz_redbx.rs"
test = false
doc = false
