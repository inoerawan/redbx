name: CI

on:
  pull_request:
  push: # required for actions/cache to work
    branches:
      - master

jobs:
  ci:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest", "ubuntu-24.04-arm"]

    runs-on: ${{ matrix.os }}

    env:
      RUSTFLAGS: --deny warnings

    steps:
      - uses: actions/checkout@v4
      - name: Cache
        id: rust-cache
        uses: actions/cache@v4
        with:
            path: |
                ~/.cargo/bin/
                ~/.cargo/registry/index/
                ~/.cargo/registry/cache/
                ~/.cargo/git/db/
                target/
                fuzz/target/
            key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.toml', '.github/workflows/*.yml', 'rust-toolchain') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        run: |
            rustup component add rustfmt
            rustup component add clippy

      - name: OSX x86 rust
        if: startsWith(matrix.os, 'macos')
        run: |
          # For some reason this is required to run the fuzzer on OSX
          rustup target add x86_64-apple-darwin

      - name: Setup wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
            version: "24.0.0"

      - name: Install cargo-deny
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install --force --version 0.16.2 cargo-deny --locked

      - name: Install cargo-fuzz
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install --force --version 0.12.0 cargo-fuzz --locked

      - name: Install just
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo install --force --version 1.36.0 just --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Compile (default features)
        run: cargo check --all --all-targets

      - name: Compile (all features)
        run: cargo check --all --all-targets --all-features

      - name: Compile (no features)
        run: cargo check --all --all-targets --no-default-features

      - name: Compile (`wasm32-unknown-unknown`)
        if: matrix.os == 'ubuntu-latest'
        run: |
            rustup target add wasm32-unknown-unknown
            # Not possible to set default members for specific a target:
            # https://github.com/rust-lang/cargo/issues/6179
            command="cargo check -p $(cargo pkgid) -p redbx-derive --target wasm32-unknown-unknown"
            $command
            $command --all-features
            $command --no-default-features
            rustup target remove wasm32-unknown-unknown

      - name: Clippy
        run: cargo clippy --all --all-targets -- -Dwarnings

      - name: Fuzzer
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos')
        run: just fuzz_ci

      - name: Run tests
        run: just test_all

      - name: Run CPython wrapper tests
        if: runner.os != 'Windows'
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip3 install --upgrade pip
          pip3 install maturin
          just test_py

      - name: Run CPython wrapper tests
        if: runner.os == 'Windows'
        run: |
          python3 -m venv venv
          venv\Scripts\activate
          pip3 install --upgrade pip
          pip3 install maturin
          just test_py

      - name: Run WASI tests
        if: runner.os != 'Windows'
        run: |
          RUSTFLAGS="" just test_wasi

  # Cross-compiles redbx-mobile for every Android ABI, generates the Kotlin
  # bindings, and compiles the Android library and its instrumentation tests.
  # This is what keeps the Android path from silently rotting; without it, the
  # only thing verified is the host-side Rust.
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            i686-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: android-${{ hashFiles('**/Cargo.toml', 'rust-toolchain') }}

      - name: Install cargo-ndk
        run: cargo install --force --version 3.5.4 cargo-ndk --locked

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build native libraries and Kotlin bindings
        run: bash scripts/build_mobile.sh android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # assembleDebugAndroidTest compiles the instrumentation tests but does not
      # run them — running needs a device. See the `android-instrumentation` job.
      - name: Assemble AAR and compile instrumentation tests
        working-directory: android
        run: gradle :redbx:assembleRelease :redbx:assembleDebugAndroidTest

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: redbx-android-aar
          path: android/redbx/build/outputs/aar/*.aar

  # Actually runs the on-device tests in an emulator. Slower and more flaky than
  # the build job above, so it is kept separate — the build job is the gate, this
  # one is the real verification.
  android-instrumentation:
    runs-on: ubuntu-latest
    needs: android

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android targets
        run: rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install --force --version 3.5.4 cargo-ndk --locked

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build native libraries and Kotlin bindings
        run: bash scripts/build_mobile.sh android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: gradle :redbx:connectedDebugAndroidTest
